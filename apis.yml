aid: easyknock
name: EasyKnock
description: 'EasyKnock was a New York based residential real estate fintech, founded
  in 2016 by Jared Kessler, that pioneered consumer sale-leaseback in the United States:
  homeowners sold their house to EasyKnock for cash and stayed on as renting tenants
  with an option to repurchase. The company raised roughly $430 million in equity and
  debt and rolled up several proptech businesses — Ribbon Home, Onder, Balance Home,
  HomePace and FarmlandFinder — before consumer lawsuits and state attorney general
  and regulator actions in Massachusetts, Michigan, Connecticut, Texas, Maryland, South
  Carolina, Pennsylvania and Ohio over its sale-leaseback disclosures. EasyKnock announced
  it had closed its doors on December 6, 2024. Its website is now a single static shutdown
  notice, its api.easyknock.com host answers Cloudflare error 1016 (origin DNS deleted),
  and it never published a public developer program, API reference, SDK or machine-readable
  specification. This profile is retained as a historical record; there is no API surface
  to enrich.'
